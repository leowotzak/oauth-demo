<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorize {{.ClientID}}</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f8; color: #1c2530; margin: 0; padding: 48px 16px; }
  main { max-width: 380px; margin: 0 auto; background: #fff; border: 1px solid #d5dbe1; border-radius: 6px; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #4a5664; }
  ul { margin: 0 0 20px; padding-left: 20px; }
  .error { color: #b03a3a; font-weight: 600; }
  code { font-size: 13px; color: #4a5664; }
  label { display: block; font-size: 14px; margin-bottom: 12px; }
  input[type=text], input[type=password] { display: block; width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; font-size: 15px; border: 1px solid #b8c1cb; border-radius: 4px; }
  .buttons { display: flex; gap: 8px; margin-top: 16px; }
  button { flex: 1; padding: 10px; font-size: 15px; border-radius: 4px; border: 1px solid #1f6a86; cursor: pointer; }
  button[value=allow] { background: #1f6a86; color: #fff; }
  button[value=deny] { background: #fff; color: #1f6a86; }
</style>
</head>
<body>
<main>
  <h1>Sign in to auth-server</h1>
  <p><strong>{{.ClientID}}</strong> wants to:</p>
  <ul>
    {{range .Scopes}}<li>{{.Description}} <code>{{.Name}}</code></li>{{end}}
  </ul>

  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}

  <form method="post" action="/authorize">
    <!-- The request details, carried to POST /authorize. Hidden fields can be
         edited by anyone, so the POST handler checks all of them again. -->
    <input type="hidden" name="response_type" value="code">
    <input type="hidden" name="client_id" value="{{.ClientID}}">
    <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
    <input type="hidden" name="scope" value="{{.Scope}}">
    <input type="hidden" name="state" value="{{.State}}">
    <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
    <input type="hidden" name="code_challenge_method" value="S256">

    <label>Username <input type="text" name="username" value="{{.Username}}" autocomplete="username" autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="current-password"></label>

    <div class="buttons">
      <button type="submit" name="decision" value="deny">Deny</button>
      <button type="submit" name="decision" value="allow">Allow</button>
    </div>
  </form>
</main>
</body>
</html>
