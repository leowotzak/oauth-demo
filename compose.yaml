# Runs the whole suite:  docker compose up --build
# Then open http://localhost:9000 and log in as alice / wonderland-42.
#
# Each service reads its own .env file (tutorial only: plaintext secrets).
# The "environment" entries override only what differs inside Docker:
#   - LISTEN_ADDR: listen on all interfaces, so the published port works
#   - back-channel URLs: containers reach each other by service name
#     (auth-server, resource-server, redis), never "localhost", which inside
#     a container means the container itself
# Front-channel URLs (anything your browser follows) stay on localhost.
#
# Running the apps with `go run .` instead? Start just Redis:
#   docker compose up -d redis

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"] # also write changes to disk
    ports:
      - "6379:6379" # so `go run .` and redis-cli on your machine can reach it
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-server:
    build:
      context: .
      args:
        SERVICE: auth-server
    env_file: auth-server/.env
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      REDIS_URL: redis://redis:6379/0 # authorization codes, revoked token IDs
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  resource-server:
    build:
      context: .
      args:
        SERVICE: resource-server
    env_file: resource-server/.env
    environment:
      LISTEN_ADDR: 0.0.0.0:8081
      # Back channel: fetch the public key from the auth-server container.
      # ISSUER stays http://localhost:8080: it's the name tokens carry, not an address.
      JWKS_URL: http://auth-server:8080/.well-known/jwks.json
      REDIS_URL: redis://redis:6379/0 # notes, and checking revoked token IDs
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      auth-server:
        condition: service_started

  client-app:
    build:
      context: .
      args:
        SERVICE: client-app
    env_file: client-app/.env
    environment:
      LISTEN_ADDR: 0.0.0.0:9000
      # Front channel: your browser follows this to /authorize.
      AUTH_SERVER_URL: http://localhost:8080
      # Back channel: client-app's own /token and /revoke requests, from inside Docker.
      AUTH_SERVER_INTERNAL_URL: http://auth-server:8080
      NOTES_API_URL: http://resource-server:8081
      REDIS_URL: redis://redis:6379/0 # sessions
    ports:
      - "9000:9000"
    depends_on:
      redis:
        condition: service_healthy
      auth-server:
        condition: service_started
      resource-server:
        condition: service_started

volumes:
  redis-data:
